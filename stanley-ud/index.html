<div id="loader-screen">

const stanleyAssets = {"StreamingAssets/scenes/memoryzonepartone_ud_master":[397032370,"application/octet-stream",["./chunks/memoryzonepartone-000","./chunks/memoryzonepartone-001","./chunks/memoryzonepartone-002","./chunks/memoryzonepartone-003","./chunks/memoryzonepartone-004","./chunks/memoryzonepartone-005","./chunks/memoryzonepartone-006","./chunks/memoryzonepartone-007","./chunks/memoryzonepartone-008","./chunks/memoryzonepartone-009","./chunks/memoryzonepartone-010","./chunks/memoryzonepartone-011","./chunks/memoryzonepartone-012","./chunks/memoryzonepartone-013","./chunks/memoryzonepartone-014","./chunks/memoryzonepartone-015","./chunks/memoryzonepartone-016","./chunks/memoryzonepartone-017","./chunks/memoryzonepartone-018","./chunks/memoryzonepartone-019","./chunks/memoryzonepartone-020","./chunks/memoryzonepartone-021","./chunks/memoryzonepartone-022","./chunks/memoryzonepartone-023","./chunks/memoryzonepartone-024"]],"StreamingAssets/scenes/memoryzoneparttwo_ud_master":[354634675,"application/octet-stream",["./chunks/memoryzoneparttwo-000","./chunks/memoryzoneparttwo-001","./chunks/memoryzoneparttwo-002","./chunks/memoryzoneparttwo-003","./chunks/memoryzoneparttwo-004","./chunks/memoryzoneparttwo-005","./chunks/memoryzoneparttwo-006","./chunks/memoryzoneparttwo-007","./chunks/memoryzoneparttwo-008","./chunks/memoryzoneparttwo-009","./chunks/memoryzoneparttwo-010","./chunks/memoryzoneparttwo-011","./chunks/memoryzoneparttwo-012","./chunks/memoryzoneparttwo-013","./chunks/memoryzoneparttwo-014","./chunks/memoryzoneparttwo-015","./chunks/memoryzoneparttwo-016","./chunks/memoryzoneparttwo-017","./chunks/memoryzoneparttwo-018","./chunks/memoryzoneparttwo-019","./chunks/memoryzoneparttwo-020","./chunks/memoryzoneparttwo-021","./chunks/memoryzoneparttwo-022"]],"StreamingAssets/scenes/memoryzonepartthree_ud_master":[244552655,"application/octet-stream",["./chunks/memoryzonepartthree-000","./chunks/memoryzonepartthree-001","./chunks/memoryzonepartthree-002","./chunks/memoryzonepartthree-003","./chunks/memoryzonepartthree-004","./chunks/memoryzonepartthree-005","./chunks/memoryzonepartthree-006","./chunks/memoryzonepartthree-007","./chunks/memoryzonepartthree-008","./chunks/memoryzonepartthree-009","./chunks/memoryzonepartthree-010","./chunks/memoryzonepartthree-011","./chunks/memoryzonepartthree-012","./chunks/memoryzonepartthree-013","./chunks/memoryzonepartthree-014","./chunks/memoryzonepartthree-015"]],"StreamingAssets/scenes/apartment_ending_ud_master":[167646471,"application/octet-stream",["./chunks/apartment-ending-000","./chunks/apartment-ending-001","./chunks/apartment-ending-002","./chunks/apartment-ending-003","./chunks/apartment-ending-004","./chunks/apartment-ending-005","./chunks/apartment-ending-006","./chunks/apartment-ending-007","./chunks/apartment-ending-008","./chunks/apartment-ending-009","./chunks/apartment-ending-010"]],"StreamingAssets/scenes/map1_ud_master":[289389155,"application/octet-stream",["./chunks/map1-000","./chunks/map1-001","./chunks/map1-002","./chunks/map1-003","./chunks/map1-004","./chunks/map1-005","./chunks/map1-006","./chunks/map1-007","./chunks/map1-008","./chunks/map1-009","./chunks/map1-010","./chunks/map1-011","./chunks/map1-012","./chunks/map1-013","./chunks/map1-014","./chunks/map1-015","./chunks/map1-016","./chunks/map1-017","./chunks/map1-018"]],"StreamingAssets/scenes/map2_ud_master":[124710885,"application/octet-stream",["./chunks/map2-000","./chunks/map2-001","./chunks/map2-002","./chunks/map2-003","./chunks/map2-004","./chunks/map2-005","./chunks/map2-006","./chunks/map2-007"]],"StreamingAssets/scenes/map_one_ud_master":[90536719,"application/octet-stream",["./chunks/map-one-000","./chunks/map-one-001","./chunks/map-one-002","./chunks/map-one-003","./chunks/map-one-004","./chunks/map-one-005"]],"StreamingAssets/scenes/map_two_ud_master":[81747114,"application/octet-stream",["./chunks/map-two-000","./chunks/map-two-001","./chunks/map-two-002","./chunks/map-two-003","./chunks/map-two-004","./chunks/map-two-005"]],"StreamingAssets/scenes/eight_ud_master":[36056999,"application/octet-stream",["./chunks/eight-000","./chunks/eight-001","./chunks/eight-002"]],"StreamingAssets/scenes/zending_ud_master":[54317089,"application/octet-stream",["./chunks/zending-000","./chunks/zending-001","./chunks/zending-002","./chunks/zending-003"]],"StreamingAssets/voice.default":[190940367,"application/octet-stream",["./chunks/voice-default-000","./chunks/voice-default-001","./chunks/voice-default-002","./chunks/voice-default-003","./chunks/voice-default-004","./chunks/voice-default-005","./chunks/voice-default-006","./chunks/voice-default-007","./chunks/voice-default-008","./chunks/voice-default-009","./chunks/voice-default-010","./chunks/voice-default-011"]]};
const stanleyNativeFetch = window.fetch.bind(window);
const stanleyAssetBase = new URL('./', document.baseURI).href;
const stanleyAssetBasePath = new URL(stanleyAssetBase).pathname;
const stanleyAssetCacheName = 'stanley-assets-v1';
let stanleyAssetCachePromise;
function stanleyAssetCache() {
    if (!stanleyAssetCachePromise) {
        stanleyAssetCachePromise = (window.caches
            ? caches.open(stanleyAssetCacheName)
            : Promise.resolve(null)).catch(() => null);
    }
    return stanleyAssetCachePromise;
}
function stanleyChunkKey(url) {
    return new URL(url, document.baseURI).href;
}
async function stanleyChunkResponse(url, options) {
    const cache = await stanleyAssetCache();
    if (cache) {
        const cached = await cache.match(stanleyChunkKey(url)).catch(() => undefined);
        if (cached) return cached;
    }
    return stanleyNativeFetch(url, options);
}
function stanleyAssetEntry(url) {
    let absolute;
    try {
        absolute = new URL(url, document.baseURI);
    } catch (error) {
        return undefined;
    }
    absolute.hash = '';
    absolute.search = '';

    let path;
    try {
        path = decodeURIComponent(absolute.pathname);
    } catch (error) {
        path = absolute.pathname;
    }
    path = path.replace(/\/{2,}/g, '/');

    const relative = path.startsWith(stanleyAssetBasePath)
        ? path.slice(stanleyAssetBasePath.length)
        : path;
    if (stanleyAssets[relative]) return stanleyAssets[relative];

    let suffixMatch;
    Object.keys(stanleyAssets).forEach(key => {
        if (path.endsWith('/' + key) && (!suffixMatch || key.length > suffixMatch.length)) {
            suffixMatch = key;
        }
    });
    if (suffixMatch) return stanleyAssets[suffixMatch];

    const name = path.slice(path.lastIndexOf('/') + 1);
    const byName = Object.keys(stanleyAssets).filter(key => key.slice(key.lastIndexOf('/') + 1) === name);
    if (byName.length === 1) return stanleyAssets[byName[0]];
    if (/(^|\/)StreamingAssets\//.test(path)) {
        console.warn('StreamingAssets request does not match the split config:', absolute.href);
    }
    return undefined;
}
window.fetch = async function (input, options) {
    const url = input instanceof Request ? input.url : input;
    const entry = stanleyAssetEntry(url);
    if (!entry) return stanleyNativeFetch(input, options);
    const [size, type, parts] = entry;
    let index = 0;
    let reader;
    let received = 0;
    const stream = new ReadableStream({
        async pull(controller) {
            while (true) {
                if (!reader) {
                    if (index === parts.length) {
                        if (received !== size) throw new Error('Incomplete Stanley asset');
                        controller.close();
                        return;
                    }
                    const response = await stanleyChunkResponse(parts[index++], { signal: options?.signal });
                    if (!response.ok) throw new Error('Stanley asset chunk returned HTTP ' + response.status);
                    reader = response.body.getReader();
                }
                const { done, value } = await reader.read();
                if (!done) {
                    received += value.byteLength;
                    controller.enqueue(value);
                    return;
                }
                reader.releaseLock();
                reader = undefined;
            }
        },
        cancel(reason) { return reader?.cancel(reason); }
    });
    return new Response(stream, { headers: { 'Content-Length': String(size), 'Content-Type': type } });
};

const canvas = document.querySelector('#game');
const loaderScreen = document.querySelector('#loader-screen');
const progressBar = document.querySelector('#progress');
const progressFill = document.querySelector('#progress-fill');
const status = document.querySelector('#status');

const downloadShare = 0.85;
const preloadShare = 0.6;
const cacheName = 'stanley-build-v1';
let shownProgress = 0;
let downloadStart = 0;

function setProgress(value, message) {
    const clamped = Math.max(0, Math.min(1, value || 0));
    shownProgress = Math.max(shownProgress, clamped);
    const percent = Math.round(shownProgress * 100);
    progressFill.style.width = percent + '%';
    progressBar.setAttribute('aria-valuenow', String(percent));
    if (message) status.textContent = message;
}

const partProgress = { loaded: 0, total: 0 };

function renderPartProgress() {
    if (!partProgress.total) return;
    const ratio = Math.min(partProgress.loaded / partProgress.total, 1);
    const span = downloadShare - downloadStart;
    setProgress(downloadStart + span * ratio, 'Downloading game files… ' + partProgress.loaded + '/' + partProgress.total);
}

function getParts(file, start, end) {
    const parts = [];
    for (let i = start; i <= end; i++) parts.push(file + '.part' + i);
    return parts;
}

function getAssetParts() {
    const parts = [];
    Object.keys(stanleyAssets).forEach(key => {
        stanleyAssets[key][2].forEach(part => parts.push(part));
    });
    return parts;
}

async function preloadAssets() {
    const cache = await stanleyAssetCache();
    const parts = getAssetParts();
    const total = parts.length;
    let done = 0;
    const failures = [];

    const step = () => {
        done += 1;
        setProgress(preloadShare * (done / total), 'Preloading assetbundles… ' + done + '/' + total);
    };

    setProgress(0, 'Preloading assetbundles… 0/' + total);

    const worker = async () => {
        while (parts.length) {
            const part = parts.shift();
            const key = stanleyChunkKey(part);

            if (cache) {
                const existing = await cache.match(key).catch(() => undefined);
                if (existing) {
                    step();
                    continue;
                }
            }

            try {
                const response = await stanleyNativeFetch(part);
                if (!response.ok) {
                    failures.push({ part, status: response.status });
                    step();
                    continue;
                }

                const buffer = await response.arrayBuffer();

                if (cache) {
                    await cache.put(key, new Response(buffer, {
                        headers: { 'Content-Type': 'application/octet-stream' }
                    })).catch(error => console.warn('Could not cache ' + part + ':', error));
                }
            } catch (error) {
                failures.push({ part, status: 0, error });
            }

            step();
        }
    };

    const workers = [];
    for (let i = 0; i < 4; i++) workers.push(worker());
    await Promise.all(workers);

    if (failures.length) {
        reportPreloadFailures(failures, total);
    }
    return failures;
}

function reportPreloadFailures(failures, total) {
    const statuses = {};
    failures.forEach(failure => {
        const key = failure.status ? 'HTTP ' + failure.status : 'network error';
        statuses[key] = (statuses[key] || 0) + 1;
    });

    const summary = Object.keys(statuses)
        .map(key => statuses[key] + ' × ' + key)
        .join(', ');

    const blocked = failures.some(failure => failure.status === 403)
        || failures.some(failure => failure.status === 404);

    const lines = [
        'Pre-loading assetbundles failed.',
        '',
        failures.length + ' of ' + total + ' parts could not be downloaded (' + summary + ').'
    ];

    if (blocked) {
        lines.push('');
        lines.push('HTTP 403/404 usually means the bundles are not deployed yet');
        lines.push('(uncommitted chunks, or a stale <base> commit hash).');
    }

    lines.push('');
    lines.push('The game will still start and will load assetbundles on demand.');
    lines.push('');
    lines.push('First failing URL:');
    lines.push(String(failures[0].part));

    window.alert(lines.join('\n'));
    console.warn('Preload failures:', failures);
}

async function openCache() {
    try {
        return window.caches ? await caches.open(cacheName) : null;
    } catch (error) {
        console.warn('Cache storage unavailable:', error);
        return null;
    }
}

async function readPart(part) {
    const response = await stanleyNativeFetch(part, { cache: 'no-store' });
    if (!response.ok) throw new Error('Failed to fetch ' + part + ' (HTTP ' + response.status + ')');
    return response.arrayBuffer();
}

async function mergeFiles(fileParts, cacheKey) {
    partProgress.total += fileParts.length;
    renderPartProgress();

    const cache = await openCache();
    if (cache) {
        const cached = await cache.match(cacheKey).catch(() => undefined);
        if (cached) {
            const blob = await cached.blob();
            partProgress.loaded += fileParts.length;
            renderPartProgress();
            return URL.createObjectURL(blob);
        }
    }

    const merged = new Blob(await Promise.all(fileParts.map(async part => {
        const buffer = await readPart(part);
        partProgress.loaded += 1;
        renderPartProgress();
        return buffer;
    })));

    if (cache) {
        try {
            await cache.put(cacheKey, new Response(merged, { headers: { 'Content-Type': 'application/octet-stream' } }));
        } catch (error) {
            console.warn('Could not cache ' + cacheKey + ':', error);
        }
    }

    return URL.createObjectURL(merged);
}

async function loadGame() {
    setProgress(0, 'Loading…');

    const preload = window.confirm('Pre-load assetbundles? (will speed up loading times in exchange for a longer wait)');

    downloadStart = 0;
    if (preload) {
        downloadStart = preloadShare;
        const failures = await preloadAssets();
        if (failures.length) {
            status.textContent = 'Preload incomplete (' + failures.length + ' parts failed) — continuing';
        }
    }

    const dataPath = 'Build/Stanley.data.unityweb';
    const codePath = 'Build/Stanley.wasm.unityweb';

    const [dataUrl, codeUrl] = await Promise.all([
        mergeFiles(getParts(dataPath, 0, 5), dataPath),
        mergeFiles([codePath], codePath)
    ]);

    setProgress(downloadShare, preload ? 'Starting… (assetbundles preloaded)' : 'Starting… (assetbundles load on demand)');
    canvas.style.display = 'block';

    const game = await createUnityInstance(canvas, {
        dataUrl,
        frameworkUrl: 'Build/Stanley.framework.js',
        codeUrl,
        streamingAssetsUrl: new URL('StreamingAssets', document.baseURI).href,
        companyName: 'Crows Crows Crows',
        productName: 'The Stanley Parable: Ultra Deluxe',
        productVersion: '1.0',
        devicePixelRatio: 1,
        autoSyncPersistentDataPath: true
    }, progress => {
        setProgress(downloadShare + (1 - downloadShare) * progress, 'Loading… ' + Math.round(progress * 100) + '%');
    });

    URL.revokeObjectURL(dataUrl);
    URL.revokeObjectURL(codeUrl);
    return game;
}

loadGame().then(game => {
    window.stanley = game;
    loaderScreen.classList.add('hidden');
    setTimeout(() => loaderScreen.remove(), 500);
    canvas.focus();
}).catch(error => {
    status.textContent = String(error);
    console.error(error);
});
</script>
