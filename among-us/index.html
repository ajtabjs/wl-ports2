<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Among Us</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link href="https://fonts.upset.dev/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #000;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        display: none;
        width: 100vw;
        height: 100vh;
        background: #000;
      }

      #loader-screen {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Figtree', Arial, sans-serif;
        z-index: 999;
      }

      #loader-screen h1 {
        color: #fff;
        font-size: 2rem;
        margin-bottom: 24px;
        letter-spacing: 0.05em;
        animation: rainbow-pulse 2s ease-in-out infinite;
      }

      @keyframes rainbow-pulse {
        0% { color: #ff0000; transform: scale(1); }
        16.66% { color: #ff8800; transform: scale(1.05); }
        33.33% { color: #ffff00; transform: scale(1); }
        50% { color: #00ff00; transform: scale(1.05); }
        66.66% { color: #0088ff; transform: scale(1); }
        83.33% { color: #8800ff; transform: scale(1.05); }
        100% { color: #ff0000; transform: scale(1); }
      }

      .file-row {
        display: flex;
        gap: 8px;
        font-size: 0.95rem;
        margin: 4px 0;
      }

      .file-name {
        color: #cf4242;
      }

      .file-status {
        color: #ffeb3b;
      }

      .file-status.pending {
        color: #888;
      }

      #progress-bar-container {
        margin-top: 16px;
        width: 300px;
        height: 6px;
        background: #222;
        border-radius: 3px;
        overflow: hidden;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #87cefa;
        border-radius: 3px;
        transition: width 0.15s ease;
      }

      #unity-warning {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
      }
    </style>
  </head>
  <body>

    <div id="loader-screen">
      <h1>loading...</h1>
      <p style="margin-bottom: 24px;color:white;"> no meme on this loader :(</p>
      <div class="file-row">
        <span class="file-name">Build.data:</span>
        <span class="file-status pending" id="status-data">waiting...</span>
      </div>
      <div class="file-row">
        <span class="file-name">Build.wasm:</span>
        <span class="file-status pending" id="status-wasm">waiting...</span>
      </div>
      <div id="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script>
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; font-family: Figtree, sans-serif;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px; font-family: Figtree, sans-serif;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        unityShowBanner('WebGL builds are not supported on mobile devices.');
      }

      function setStatus(id, text, done) {
        var el = document.getElementById(id);
        el.textContent = text;
        el.classList.remove('pending');
        if (done) el.style.color = '#00e676';
        else el.style.color = '#ffeb3b';
      }

      function setProgress(pct) {
        document.getElementById('progress-bar').style.width = pct + '%';
      }

      setStatus('status-data', 'waiting...');
      setStatus('status-wasm', 'waiting...');

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var config = {
        dataUrl: buildUrl + "/Build.data",
        frameworkUrl: buildUrl + "/Build.framework.js",
        codeUrl: buildUrl + "/Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Innersloth",
        productName: "Among Us",
        productVersion: "2026.6.5",
        showBanner: unityShowBanner,
      };

      window.splitRoot = "";

      function startGame() {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(document.querySelector("#unity-canvas"), config, function (progress) {
            if (progress < 0.5) {
              var pct = Math.round(progress * 200);
              setStatus('status-data', 'loading... ' + pct + '%');
            } else {
              setStatus('status-data', 'done \u2713', true);
              if (progress < 1) {
                var pct = Math.round((progress - 0.5) * 200);
                setStatus('status-wasm', 'loading... ' + pct + '%');
              }
            }
            if (progress >= 1) {
              setStatus('status-wasm', 'done \u2713', true);
            }
            setProgress(Math.round(progress * 100));
          }).then(function (unityInstance) {
            setTimeout(function () {
              document.getElementById('loader-screen').style.display = 'none';
              document.getElementById('unity-canvas').style.display = 'block';
            }, 500);
          }).catch(function (message) {
            document.getElementById('loader-screen').innerHTML =
              '<h1 style="color:#ff4444">Error loading game.<br><small style="font-size:0.8rem">' + message + '</small></h1>';
          });
        };
        document.body.appendChild(script);
      }

      var splitScript = document.createElement("script");
      splitScript.src = "split-loader.js";
      splitScript.onload = function () {
        if (!window.splitLoader) {
          alert("split-loader.js failed to load.");
          return;
        }
        setStatus('status-data', 'loading... 0%');
        window.splitLoader.preload(function (loaded, total) {
          var pct = Math.round(loaded / total * 100);
          setStatus('status-data', 'loading... ' + pct + '%');
          setProgress(pct);
        }).then(startGame).catch(function (err) {
          console.error("Failed to load game data parts:", err);
        });
      };
      splitScript.onerror = function () {
        alert("Could not load split-loader.js");
      };
      document.body.appendChild(splitScript);

    </script>
  </body>
</html>
