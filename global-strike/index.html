<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Global Strike</title>
    <link rel="stylesheet" crossorigin href="./assets/index-BLkIhPSX.css" />
    <script>
      async function mergeFiles(fileParts, cacheKey) {
        const cache = await caches.open("crackers");
        const cachedResponse = await cache.match(cacheKey);
        if (cachedResponse) {
          const blob = await cachedResponse.blob();
          return URL.createObjectURL(blob);
        }
        const buffers = await Promise.all(
          fileParts.map(part => fetch(part).then(r => {
            if (!r.ok) throw new Error("Failed to fetch " + part);
            return r.arrayBuffer();
          }))
        );
        const mergedBlob = new Blob(buffers, { type: "application/javascript" });
        await cache.put(cacheKey, new Response(mergedBlob, { headers: { "Content-Type": "application/javascript" } }));
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      async function loadGame() {
        const mainJs = "assets/index-BdUnKe1Y.js";
        const statusEl = document.getElementById("status");
        const bootStatusEl = document.getElementById("boot-status");
        try {
          if (statusEl) statusEl.textContent = "Loading game files…";
          if (bootStatusEl) bootStatusEl.textContent = "Loading game files…";
          const mainUrl = await mergeFiles(getParts(mainJs, 0, 1), mainJs);
          const s = document.createElement("script");
          s.type = "module";
          s.crossOrigin = "anonymous";
          s.src = mainUrl;
          s.onerror = (e) => {
            if (statusEl) statusEl.textContent = "Failed to load game script.";
            if (bootStatusEl) bootStatusEl.textContent = "Failed to load game script.";
          };
          document.body.appendChild(s);
        } catch (e) {
          if (statusEl) statusEl.textContent = "Failed to load game files: " + (e && e.message ? e.message : e);
          if (bootStatusEl) bootStatusEl.textContent = "Failed to load game files: " + (e && e.message ? e.message : e);
          throw e;
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadGame);
      } else {
        loadGame();
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="launcher">
      <main class="panel">
        <h1>Global Strike</h1>
        <p id="update-status" class="update-status" hidden></p>

        <h2>Choose a server</h2>
        <ul id="server-list" class="servers"></ul>
        <button id="add-toggle" class="link" type="button">+ Add custom server</button>
        <div id="add-form" class="add-form" hidden>
          <input id="add-name" class="cs-input" type="text" maxlength="30" placeholder="Server name" autocomplete="off" />
          <input id="add-address" class="cs-input" type="text" placeholder="/cs16/myserver/websocket or host:port" autocomplete="off" spellcheck="false" />
          <div class="add-actions">
            <button id="add-save" class="cs-btn" type="button">Add</button>
            <button id="add-cancel" class="link" type="button">Cancel</button>
          </div>
          <p id="add-error" class="error" hidden></p>
        </div>

        <h2>Your name</h2>
        <input
          id="player-name"
          class="cs-input"
          type="text"
          maxlength="18"
          placeholder="4-18 characters"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="name-error" class="error" hidden></p>

        <details id="options">
          <summary>Options</summary>
          <div id="option-list" class="options"></div>
        </details>

        <hr class="cs-hr" />
        <button id="play" class="cs-btn play" type="button" disabled>Play</button>
        <p id="status" class="status"></p>
      </main>
    </div>

    <div id="boot" hidden>
      <p id="boot-status">Starting&hellip;</p>
      <div class="cs-progress-bar">
        <div class="bars"></div>
        <div id="boot-cover" class="cover"></div>
      </div>
    </div>

  </body>
</html>
