<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/ajtabjs/wl-ports2@main/global-strike/">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Global Strike</title>
    <link rel="stylesheet" crossorigin href="./assets/index-BLkIhPSX.css">
    <script>
      (function () {
        var BUNDLE = "assets/index-C0nTH1JV.js";
        var PARTS = [BUNDLE + ".part0", BUNDLE + ".part1"];
        var TOTAL_SIZE = 26596333;
        var CACHE_NAME = "global-strike-split";
        var CACHE_KEY = BUNDLE;
        var ASSET_SITE = /,\s*import\.meta\.url\s*\)/g;

        var statusEl = document.getElementById("status");
        var bootStatusEl = document.getElementById("boot-status");

        function setStatus(message) {
          if (statusEl) statusEl.textContent = message;
          if (bootStatusEl) bootStatusEl.textContent = message;
        }

        function describe(err) {
          if (location.protocol === "file:") {
            return "HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP";
          }
          return (err && err.message) || String(err);
        }

        function fetchParts() {
          if (typeof caches === "undefined") return Promise.resolve(null);
          return caches.open(CACHE_NAME).then(function (cache) {
            return cache.match(CACHE_KEY).then(function (hit) {
              return hit ? hit.arrayBuffer() : null;
            });
          }).catch(function () {
            return null;
          });
        }

        function storeMerged(buffer) {
          if (typeof caches === "undefined") return Promise.resolve();
          return caches.open(CACHE_NAME).then(function (cache) {
            return cache.put(
              CACHE_KEY,
              new Response(buffer, { headers: { "Content-Type": "text/javascript" } })
            );
          }).catch(function () {});
        }

        function mergeParts() {
          return fetchParts().then(function (cached) {
            if (cached) return cached;
            setStatus("Loading game files…");
            return Promise.all(PARTS.map(function (part) {
              return fetch(part).then(function (res) {
                if (!res.ok) throw new Error("Failed to fetch " + part + ": " + res.status);
                return res.arrayBuffer();
              });
            })).then(function (buffers) {
              var total = 0;
              buffers.forEach(function (b) { total += b.byteLength; });
              if (total !== TOTAL_SIZE) {
                throw new Error(
                  "Merged bundle is " + total + " bytes, expected " + TOTAL_SIZE +
                  " — the .part files are incomplete or altered."
                );
              }
              var merged = new Uint8Array(total);
              var offset = 0;
              buffers.forEach(function (b) {
                merged.set(new Uint8Array(b), offset);
                offset += b.byteLength;
              });
              return storeMerged(merged.slice().buffer).then(function () {
                return merged.buffer;
              });
            });
          });
        }

        function loadGame() {
          return mergeParts().then(function (bytes) {
            setStatus("Starting game…");
            var source = new TextDecoder("utf-8").decode(new Uint8Array(bytes));

            var base = new URL(BUNDLE, document.baseURI).href;
            var patched = source.replace(ASSET_SITE, function () {
              return ',"' + base + '")';
            });
            if (patched === source && source.indexOf("import.meta.url") !== -1) {
              console.warn("[split-loader] no import.meta.url asset sites matched; " +
                "side modules may fail to resolve.");
            }

            var url = URL.createObjectURL(new Blob([patched], { type: "text/javascript" }));
            return import(url).then(function (mod) {
              URL.revokeObjectURL(url);
              return mod;
            }, function (err) {
              URL.revokeObjectURL(url);
              throw err;
            });
          });
        }

        function start() {
          loadGame().catch(function (err) {
            var message = "Failed to load game files: " + describe(err);
            setStatus(message);
            console.error(err);
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start);
        } else {
          start();
        }
      })();
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="launcher">
      <main class="panel">
        <h1>Global Strike</h1>
        <p id="update-status" class="update-status" hidden></p>

        <h2>Choose a server</h2>
        <ul id="server-list" class="servers"></ul>
        <button id="add-toggle" class="link" type="button">+ Add custom server</button>
        <div id="add-form" class="add-form" hidden>
          <input id="add-name" class="cs-input" type="text" maxlength="30" placeholder="Server name" autocomplete="off" />
          <input id="add-address" class="cs-input" type="text" placeholder="/cs16/myserver/websocket or host:port" autocomplete="off" spellcheck="false" />
          <div class="add-actions">
            <button id="add-save" class="cs-btn" type="button">Add</button>
            <button id="add-cancel" class="link" type="button">Cancel</button>
          </div>
          <p id="add-error" class="error" hidden></p>
        </div>

        <h2>Your name</h2>
        <input
          id="player-name"
          class="cs-input"
          type="text"
          maxlength="18"
          placeholder="4-18 characters"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="name-error" class="error" hidden></p>

        <details id="options">
          <summary>Options</summary>
          <div id="option-list" class="options"></div>
        </details>

        <hr class="cs-hr" />
        <button id="play" class="cs-btn play" type="button" disabled>Play</button>
        <p id="status" class="status"></p>
      </main>
    </div>

    <div id="boot" hidden>
      <p id="boot-status">Starting&hellip;</p>
      <div class="cs-progress-bar">
        <div class="bars"></div>
        <div id="boot-cover" class="cover"></div>
      </div>
    </div>

  </body>
</html>
