<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/ajtabjs/wl-ports2@main/lethalcompany/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Lethal Company Web</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; }
      #unity-container { position: relative; width: 100%; height: 100%; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #231F20; outline: none; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 240px; display: none; }
      #unity-logo { width: 154px; height: 130px; margin: 0 auto 10px; background: url('TemplateData/unity-logo-light.png') no-repeat center / contain; }
      #unity-progress-bar-empty { width: 100%; height: 12px; border: 1px solid #777; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: white; }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: rgba(0,0,0,0.7); color: white; padding: 6px 10px; display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      window.WispRelayWSState = { sock: null, recvPtr: 0, sid: 0 };
    </script>
    <script>
      async function mergeFiles(fileParts, cacheKey, onProgress) {
        const cache = await caches.open("lethalcache");
        const cachedResponse = await cache.match(cacheKey);
        if (cachedResponse) {
          const blob = await cachedResponse.blob();
          if (onProgress) onProgress(fileParts.length, fileParts.length);
          return URL.createObjectURL(blob);
        }
        const buffers = new Array(fileParts.length);
        let completed = 0;
        let nextIndex = 0;
        const CONCURRENCY = 1;
        async function worker() {
          while (true) {
            const i = nextIndex++;
            if (i >= fileParts.length) return;
            const part = fileParts[i];
            const r = await fetch(part);
            if (!r.ok) throw new Error("Failed to fetch " + part + ": " + r.status);
            buffers[i] = await r.arrayBuffer();
            completed++;
            if (onProgress) onProgress(completed, fileParts.length);
          }
        }
        const workers = [];
        for (let w = 0; w < Math.min(CONCURRENCY, fileParts.length); w++) {
          workers.push(worker());
        }
        await Promise.all(workers);
        const mergedBlob = new Blob(buffers);
        buffers.fill(null);
        await cache.put(cacheKey, new Response(mergedBlob));
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end, pad) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + String(i).padStart(pad, "0"));
        }
        return parts;
      }
    </script>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/build.data",
        frameworkUrl: buildUrl + "/build.framework.js",
        codeUrl: buildUrl + "/build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ZeekerssRBLX",
        productName: "Lethal Company",
        productVersion: "0.1",
        showBanner: unityShowBanner,
        webglContextAttributes: {
          antialias: false,
          preserveDrawingBuffer: true,
          powerPreference: "high-performance",
          failIfMajorPerformanceCaveat: false
        },
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      loadingBar.style.display = "block";

      (async () => {
        try {
          const cache = await caches.open("lethalcache");
          await Promise.all([
            cache.delete("build.data"),
            cache.delete("build.wasm"),
          ]);
        } catch (e) { console.warn("cache cleanup failed", e); }

        var dataDone = 0, dataTotal = 18, wasmDone = 0, wasmTotal = 5;
        function updateDownloadProgress() {
          var done = dataDone + wasmDone;
          var total = dataTotal + wasmTotal;
          progressBarFull.style.width = (100 * done / total) + "%";
        }
        updateDownloadProgress();

        var [dataUrl, wasmUrl] = await Promise.all([
          mergeFiles(getParts("Build/build.data", 1, 18, 2), "build.data.v2", (done, total) => {
            dataDone = done; dataTotal = total; updateDownloadProgress();
          }),
          mergeFiles(getParts("Build/build.wasm", 1, 5, 1), "build.wasm.v2", (done, total) => {
            wasmDone = done; wasmTotal = total; updateDownloadProgress();
          }),
        ]);

        var originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          this._requestUrl = url;
          if (typeof url === "string" && url.includes("build.data")) {
            url = dataUrl;
          } else if (typeof url === "string" && url.includes("build.wasm")) {
            url = wasmUrl;
          }
          this._modifiedUrl = url;
          return originalOpen.call(this, method, url, ...rest);
        };

        config.dataUrl = dataUrl;
        config.codeUrl = wasmUrl;

        var script = document.createElement("script");
        script.src = buildUrl + "/build.loader.js";
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            canvas.focus();
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
